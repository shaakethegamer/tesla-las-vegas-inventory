name: Check Tesla Inventory
on:
  push:
    branches: [main]
    paths:
      - 'monitor.py'
      - '.github/workflows/check-inventory.yml'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tesla-inventory-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check inventory
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_SECRET }}
          TESLA_ZIP: '89109'
        run: python monitor.py
      - name: Save seen VIN fingerprints
        run: |
          if [ -f seen_vins.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_vins.json
            if ! git diff --cached --quiet; then
              git commit -m "Update Tesla inventory baseline [skip ci]"
              git push
            fi
          fi
